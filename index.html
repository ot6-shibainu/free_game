<!doctype html>
<html lang="ja">
<head>
<script>
/* 一人壁打ちテニス・ブロック版 追加仕様 */
const GAME_CONFIG_V2 = {
  blockColumns: 7,
  blockRows: 7,
  ufoTriggerRemainingRatio: 1/3,   // 2/3減少した時点
  ufoScore: 10,
  ufoLaneRowsAboveBlocks: 0,       // 移動後の虹色ブロック直上を通過
  ufoMaxAppearances: 3,
  racketRows: 2,                   // テニスラケットを2段構成
  racketGapBlockRows: 6,           // ラケット間隔＝ブロック6段分
  exitMeansLeaveGame: true
};
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>一人壁打ちテニス</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,"Yu Gothic",Meiryo,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:min(430px,48vw);height:min(860px,94vh);padding:12px;background:linear-gradient(145deg,#29343e,#070a0e 55%,#1d2730);border:2px solid #56636e;border-radius:54px;box-shadow:0 18px 45px rgba(0,0,0,.35),inset 0 0 0 2px #000}
.phone{position:relative;width:100%;height:100%;overflow:hidden;border-radius:42px;background:transparent}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;z-index:0}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;background:transparent}
.title{position:absolute;left:50%;top:28px;transform:translateX(-50%);z-index:4;color:#fff;font-size:16px;font-weight:700;white-space:nowrap;text-shadow:0 1px 3px #00528b;pointer-events:none}
.score{position:absolute;right:17px;top:52px;z-index:4;color:#fff;font-size:21px;font-weight:800;letter-spacing:1px;text-shadow:0 1px 3px #00528b;pointer-events:none}
.outs{position:absolute;left:16px;top:52px;z-index:4;color:#ef2638;font-size:25px;font-weight:900;letter-spacing:3px;text-shadow:0 1px 2px #fff;pointer-events:none}
.game-btn{position:absolute;bottom:18px;height:58px;z-index:6;border:2px solid #fff;border-radius:30px;color:#fff;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.pause{left:10px;width:120px;background:#126de4}
.quit{right:10px;width:64px;background:#ed2537;font-size:30px}
.message{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,40,80,.18)}
.message-card{width:78%;padding:22px 18px;border-radius:22px;background:rgba(255,255,255,.96);text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.25)}
#messageTitle{font-size:24px;font-weight:800;color:#0878ce;margin-bottom:10px}
#messageText{font-size:15px;line-height:1.55;color:#234;white-space:pre-line}
#start{margin-top:15px;border:0;border-radius:22px;padding:10px 28px;background:#1685e9;color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.speaker{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:78px;height:5px;border-radius:4px;background:#05070a;z-index:20}
.camera{position:absolute;top:5px;left:calc(50% + 50px);width:8px;height:8px;border-radius:50%;background:#111b24;border:1px solid #65727d;z-index:20}
@media(max-width:700px){.device{width:min(430px,94vw);height:min(860px,94vh)}}

.ufo{position:absolute;left:0;top:0;z-index:3;display:none;width:68px;height:24px;font-size:24px;line-height:24px;text-align:center;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
#level{position:absolute;left:16px;top:82px;z-index:4;color:#fff;font-size:16px;font-weight:800;text-shadow:0 1px 3px #00528b;pointer-events:none;}
</style>
<style id="mobile-game-fix">html,body{width:100%;height:100%;margin:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;background:transparent}#gameCanvas,canvas{max-width:100vw;max-height:100vh;touch-action:none}button{touch-action:manipulation}body{overscroll-behavior:none}</style>
</head>
<body>
<div class="stage">
 <div class="device">
  <div class="speaker"></div><div class="camera"></div>
  <div id="phone" class="phone">
   <img class="bg" src="game_background.png" alt="スマートフォン画面背景">
   <canvas id="game" width="520" height="1020"></canvas>
   <div class="title">一人壁打ちテニス</div>
   <div id="score" class="score">00000</div>
   <div id="outs" class="outs" aria-label="アウト数"></div>
   <div id="level">1面</div>
   <div id="ufo" class="ufo">🛸</div>
   <button id="pause" class="game-btn pause">一時停止</button>
   <button id="quit" class="game-btn quit" aria-label="強制終了">×</button>
   <div id="message" class="message">
    <div class="message-card">
     <div id="messageTitle">一人壁打ちテニス</div>
     <div id="messageText">マウスポインターを左右に動かしてラケットを操作します。</div>
     <button id="start">ゲーム開始</button>
    </div>
   </div>
  </div>
 </div>
</div>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d');
const W=c.width,H=c.height;
const COLORS=['#e53935','#f28c28','#f2d13d','#43b85c','#24a6d8','#4f62d8','#9b59b6'];
const COLS=7,ROWS=7,GAP=4, SIDE=22, BLOCK_H=24, BLOCK_TOP=120 + (BLOCK_H+GAP)*2;
const blocks=[];
for(let row=0;row<ROWS;row++){for(let col=0;col<COLS;col++){blocks.push({row,col,x:0,y:0,w:0,h:BLOCK_H,alive:true,color:COLORS[row]});}}
// ゲームフィールドはスマートフォン画面そのもの。左右・上は画面限界まで使用し、下だけアウト。
// ラケットは一時停止・終了ボタンの直上に8pxの隙間で配置し、左右は画面全幅を移動可能。
const FIELD={left:0,right:W,top:0,bottom:H};
const BUTTON_BOTTOM=18;
const BUTTON_H=58;
const R={w:W/5,h:20,y:H-BUTTON_BOTTOM-BUTTON_H-8-20-20-12};
const R2={w:R.w/2,h:R.h,y:R.y-(BLOCK_H+GAP)*GAME_CONFIG_V2.racketGapBlockRows-R.h};
let racketX=(W-R.w)/2,hits=0,outs=0,points=0,state='ready',raf=0,last=0,level=1,ufoAppearances=0;
let ufo={active:false,x:0,y:0,vx:0,w:0,h:BLOCK_H};
let ball={x:W/2,y:R.y-30,vx:2.0,vy:-5.2,r:13};
function layoutBlocks(){const totalW=W-SIDE*2;const bw=(totalW-(COLS-1)*GAP)/COLS;for(const b of blocks){b.w=bw;b.x=SIDE+b.col*(bw+GAP);b.y=BLOCK_TOP+b.row*(BLOCK_H+GAP);}}
function resetBlocks(){for(const b of blocks)b.alive=true;layoutBlocks();ufo.active=false;ufo.x=0;ufo.vx=0;ufoAppearances=0;document.getElementById('ufo').style.display='none';}
function aliveCount(){return blocks.reduce((n,b)=>n+(b.alive?1:0),0);}
const score=document.getElementById('score'),outEl=document.getElementById('outs'),msg=document.getElementById('message'),mt=document.getElementById('messageTitle'),mx=document.getElementById('messageText'),start=document.getElementById('start'),pause=document.getElementById('pause'),quit=document.getElementById('quit');
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pointer(clientX){const q=c.getBoundingClientRect();const px=(clientX-q.left)*W/q.width;racketX=clamp(px-R.w/2,0,W-R.w)}
function resetBall(){const a=(Math.random()<.5?-1:1)*(0.22+Math.random()*.35);const s=5.2+(level/60)+(hits/10)*0.0166667;ball.x=racketX+R.w/2;ball.y=R.y-30;ball.vx=Math.sin(a)*s;ball.vy=-Math.cos(a)*s}
function updateScore(){score.textContent=String(points).padStart(5,'0');outEl.textContent='×'.repeat(outs);document.getElementById('level').textContent=level+'面';}
function maybeSpawnUfo(){
 if(ufo.active || ufoAppearances>=GAME_CONFIG_V2.ufoMaxAppearances)return;
 const destroyed=blocks.length-aliveCount();
 const trigger=Math.ceil(blocks.length*(2/3));
 if(destroyed>=trigger){
  ufo.active=true; ufoAppearances++;
  // UFOはブロック1個分の大きさ
  const firstBlock=blocks[0];
  ufo.w=firstBlock.w;
  ufo.h=firstBlock.h;
  const fromLeft=Math.random()<0.5;
  ufo.x=fromLeft?-ufo.w:W;
  ufo.vx=fromLeft?(2.2+level*0.08):-(2.2+level*0.08);
  // 7段の虹色ブロックを2段下げ、その直上を円盤が通過
  ufo.y=Math.max(8, BLOCK_TOP-ufo.h-8);
  document.getElementById('ufo').style.display='block';
 }
}
function updateUfo(dt){
 if(!ufo.active)return;
 ufo.x+=ufo.vx*dt;
 const el=document.getElementById('ufo');
 el.style.transform='translate('+ufo.x+'px,'+ufo.y+'px)';
 if(ufo.x>W+ufo.w || ufo.x<-ufo.w){ufo.active=false;el.style.display='none';}
}
function draw(){
 x.clearRect(0,0,W,H);
 for(const b of blocks){if(!b.alive)continue;x.fillStyle=b.color;x.fillRect(b.x,b.y,b.w,b.h);x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=1;x.strokeRect(b.x,b.y,b.w,b.h);}
 const g=x.createLinearGradient(racketX,R2.y,racketX,R.y+R.h);g.addColorStop(0,'#6be0ff');g.addColorStop(.5,'#168cff');g.addColorStop(1,'#0648c7');x.fillStyle=g;
 const upperX=racketX+(R.w-R2.w)/2;
 for(const ry of [R2.y,R.y]){const rx=(ry===R2.y?upperX:racketX);x.beginPath();x.roundRect(rx,ry,(ry===R2.y?R2.w:R.w),R.h,10);x.fill();x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=2;x.stroke();}
 const b=x.createRadialGradient(ball.x-5,ball.y-6,2,ball.x,ball.y,ball.r);b.addColorStop(0,'#fffde0');b.addColorStop(.45,'#fff400');b.addColorStop(1,'#e4bf00');x.fillStyle=b;x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.strokeStyle='rgba(255,255,255,.9)';x.stroke()
}
function hit(){hits++;updateScore();let s=Math.hypot(ball.vx,ball.vy),a=Math.atan2(ball.vx,-ball.vy)+(Math.random()-.5)*.18;a=clamp(a,-1.12,1.12);ball.vx=Math.sin(a)*s;ball.vy=-Math.abs(Math.cos(a)*s)}
function out(){outs++;updateScore();if(outs>=3){state='over';mt.textContent='GAME OVER';mx.textContent='落下球が3球になりました。\n得点：'+points+'点';start.textContent='もう一度';msg.style.display='flex';return}resetBall()}
function loop(t){
 if(state!=='playing'){last=t;draw();raf=requestAnimationFrame(loop);return}
 let dt=Math.min(2,(t-last)/16.666||1);last=t;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;updateUfo(dt);
 if(ball.x-ball.r<=FIELD.left){ball.x=FIELD.left+ball.r;ball.vx=Math.abs(ball.vx)}
 if(ball.x+ball.r>=FIELD.right){ball.x=FIELD.right-ball.r;ball.vx=-Math.abs(ball.vx)}
 if(ball.y-ball.r<=FIELD.top){ball.y=FIELD.top+ball.r;ball.vy=Math.abs(ball.vy)}
 // 円盤との衝突：ブロック1個分の円盤に当たると10点
 if(ufo.active && ball.x+ball.r>=ufo.x && ball.x-ball.r<=ufo.x+ufo.w && ball.y+ball.r>=ufo.y && ball.y-ball.r<=ufo.y+ufo.h){
   ufo.active=false; document.getElementById('ufo').style.display='none';
   points+=GAME_CONFIG_V2.ufoScore; updateScore(); ball.vy=-ball.vy;
 }
 if(ball.vy>0){
   for(const rr of [R2,R]){
    const rx=(rr===R2?racketX+(R.w-R2.w)/2:racketX); const rw=rr.w;
    if(ball.y+ball.r>=rr.y&&ball.y-ball.r<=rr.y+rr.h&&ball.x>=rx&&ball.x<=rx+rw){ball.y=rr.y-ball.r;hit();break;}
   }
 }
 for(const b of blocks){if(!b.alive)continue;if(ball.x+ball.r>=b.x&&ball.x-ball.r<=b.x+b.w&&ball.y+ball.r>=b.y&&ball.y-ball.r<=b.y+b.h){b.alive=false;hits++;points+=1;updateScore();ball.vy=-ball.vy;maybeSpawnUfo();break}}
 if(aliveCount()===0){if(level<10){level++;resetBlocks();updateScore();resetBall()}else{state='over';mt.textContent='GAME CLEAR';mx.textContent='全10面クリアしました。\n得点：'+points+'点';start.textContent='最初から';msg.style.display='flex';}}
 if(ball.y-ball.r>FIELD.bottom)out();
 draw();raf=requestAnimationFrame(loop)
}
c.addEventListener('mousemove',e=>{if(state==='playing')pointer(e.clientX)});
c.addEventListener('pointermove',e=>{if(state==='playing')pointer(e.clientX)});
c.addEventListener('touchmove',e=>{if(state==='playing'){e.preventDefault();if(e.touches[0])pointer(e.touches[0].clientX)}},{passive:false});
start.addEventListener('click',()=>{hits=0;outs=0;points=0;level=1;resetBlocks();updateScore();state='playing';msg.style.display='none';start.textContent='ゲーム開始';resetBall()});
pause.addEventListener('click',e=>{e.stopPropagation();if(state==='playing'){state='paused';pause.textContent='再開'}else if(state==='paused'){state='playing';pause.textContent='一時停止'}});
quit.addEventListener('click',e=>{
 e.stopPropagation();
 state='ready';
 if(raf) cancelAnimationFrame(raf);
 // 「×」は再スタートではなく、このゲーム画面から離れる操作。
 try{ window.location.replace('about:blank'); }catch(err){
   document.body.innerHTML='<div style="width:100vw;height:100vh;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;font-size:20px;">ゲームを終了しました</div>';
 }
});
resetBlocks();updateScore();draw();requestAnimationFrame(loop);
})();
</script>
<script id="mobile-touch-fix">(()=>{const c=document.querySelector('canvas');if(!c)return;const move=e=>{const t=e.touches&&e.touches[0];if(!t)return;const r=c.getBoundingClientRect();const x=(t.clientX-r.left)/r.width;window.dispatchEvent(new CustomEvent('gamePointerMove',{detail:{x:x}}));};c.addEventListener('touchstart',move,{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();move(e)},{passive:false});})();</script>
</body></html>
